/* Düzen: turkuaz başlık, renkli sekmeler; sol sütunda sabit harf ve ÇEVİR, ortada iç bardaklı bardak, sağda okuma kartı; altta Okuduklarım. */
:root{
  --ana:#2E86AB; --koyu:#163E5C; --mur:#26303B; --muted:#5E6B75; --kart:#FFFFFF; --soft:#FFFDF6; --line:#D9CFB8; --gold:#E5B94E;
  --unlu:#E11D48; --unsuz:#1E3A8A; --pbv:#FFE4E9; --pbc:#E3EAFB;
  --m0:#D9695F; --m1:#C98A3A; --m2:#4F9C78; --m3:#7E6FC2; --m4:#4A8CAA; --mr:var(--m1); --mra:#FFF1E2;
  --bg1:#FAF7EE; --bg2:#FAF7EE; --bg3:#FAF7EE; color-scheme:light;
  --font:'Quicksand','Trebuchet MS',Tahoma,system-ui,sans-serif;
}
html{font-size:16px}
html.tahta{font-size:clamp(18px,1.7vw,30px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  font-family:var(--font);font-weight:700;font-size:1.05rem;line-height:1.3;color:var(--mur);
  background:radial-gradient(at 50% 35%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);background-attachment:fixed;
  padding-block:10px 24px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  touch-action:manipulation;
}
button,input,select,summary{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #F5B301;outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:.6rem;min-width:0}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx i{position:absolute;top:-18px;left:var(--x);width:10px;height:15px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}

header{background:var(--ana);color:#fff;border-radius:20px;padding:.35rem 1.1rem;display:flex;align-items:center;gap:.4rem .9rem;flex-wrap:wrap;box-shadow:0 4px 0 rgba(0,0,0,.18)}
header .ders{font-size:.78rem;letter-spacing:2px;opacity:.92}
header h1{margin:0;font-size:1.9rem;line-height:1.15;font-weight:700;white-space:nowrap}
.rozetler{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.rz{min-width:2.3rem;height:2.3rem;border-radius:.6rem;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.18);padding:.15rem .3rem 0}
.rz.u{color:#E11D48} .rz.c{color:#1E3A8A}
.hsag{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.ub{background:rgba(255,255,255,.16);color:#fff;border:3px solid rgba(255,255,255,.65);border-radius:999px;padding:.2rem .8rem;min-height:2.7rem;min-width:2.7rem;cursor:pointer;font-size:1rem}
.ub.acik{background:#fff;color:var(--koyu)}
.stars{display:flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);border-radius:999px;padding:.1rem .8rem .1rem .5rem;font-size:1.2rem;min-height:2.7rem}

.ayar{background:var(--kart);border:4px solid var(--line);border-radius:20px;padding:.6rem .8rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;box-shadow:0 5px 14px rgba(60,40,10,.08)}
.ayar label.t{font-size:1rem}
#myw{flex:1 1 100%;font:700 1.15rem/1.3 var(--font);background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:.4rem .7rem;color:var(--mur);resize:vertical;min-width:0}
#letters{font:700 1.5rem/1.2 var(--font);letter-spacing:.14em;width:min(300px,100%);background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:.3rem .7rem;min-width:0;color:var(--mur)}
.mini{background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:.35rem .8rem;color:var(--mur);font-size:.95rem}
#lwarn{color:#D93F45;flex-basis:100%;margin:0}
.sesbolum{flex-basis:100%;border-top:3px dashed var(--line);padding-top:.5rem;display:grid;gap:.8rem}
.vlist{display:grid;gap:.5rem}
.vrow{display:flex;align-items:center;gap:.6rem}
.vpick{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:.4rem .7rem;cursor:pointer}
.vpick:has(input:checked){border-color:var(--m2)}
.vpick input{width:1.3rem;height:1.3rem;accent-color:var(--m2);flex:none}
.vpick span{min-width:0;display:grid}
.vpick small{color:var(--muted);overflow-wrap:anywhere;font-weight:400}
.play{width:2.8rem;height:2.8rem;border-radius:14px;border:0;background:var(--m2);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pitchrow{display:flex;align-items:center;gap:.7rem}
#pitch{flex:1;min-width:0;accent-color:var(--m2)}
#pitchVal{min-width:2.6em;text-align:right}
#vhint{margin:0;font-size:.9rem;color:var(--muted);font-weight:400}

.sekmeler{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem}
.sekme{
  display:flex;align-items:center;gap:.6rem;border:4px solid var(--mr);background:var(--kart);color:var(--mr);border-radius:18px;
  padding:.25rem .8rem;cursor:pointer;text-align:left;min-height:3.4rem;box-shadow:0 4px 0 var(--mr);min-width:0
}
.sekme:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mr)}
.sekme svg{width:2.4rem;height:2.4rem;flex:0 0 auto}
.sekme .sb{font-size:1.15rem;line-height:1.1;display:block}
.sekme .sa{font-size:.9rem;opacity:.85;display:block;font-weight:400;overflow-wrap:anywhere}
.sekme.su{background:var(--mr);color:#fff}
.sekme.su svg .pen{fill:var(--mr);opacity:1;stroke:var(--mr)}
.sekme.su svg path:not(:first-child){stroke:var(--mr)}
.sekme[data-m="1"]{--mr:var(--m0)} .sekme[data-m="2"]{--mr:var(--m1)} .sekme[data-m="3"]{--mr:var(--m2)} .sekme[data-m="4"]{--mr:var(--m4)} .sekme[data-m="5"]{--mr:var(--m3)}
.alan.m1{--mr:var(--m0)} .alan.m2{--mr:var(--m1)} .alan.m3{--mr:var(--m2)} .alan.m4{--mr:var(--m4)} .alan.m5{--mr:var(--m3)}

.alan{display:grid;grid-template-columns:minmax(13rem,.95fr) minmax(0,1.75fr) minmax(15rem,1.2fr);gap:.8rem;align-items:start}
.kol{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.kart{background:var(--kart);border-radius:20px;border:4px solid var(--mr);padding:.55rem .75rem;box-shadow:0 5px 14px rgba(60,40,10,.08);min-width:0}
.kbas{letter-spacing:1.5px;font-size:.9rem;color:var(--muted);margin-bottom:.35rem}
.secim-k{display:grid;gap:.7rem}
.secimler{display:flex;flex-wrap:wrap;gap:.45rem}
.sec{
  font-size:2.2rem;line-height:1;min-width:3.8rem;min-height:3.8rem;padding:.3rem .6rem .1rem;border-radius:16px;background:var(--soft);
  border:4px solid var(--line);color:var(--unsuz);box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center
}
.sec.v{color:var(--unlu)}
.sec:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.sec.su{border-color:var(--mr);box-shadow:0 4px 0 var(--mr);background:var(--kart)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;border-radius:10px;padding:.3rem .7rem;font-size:.95rem;color:var(--mur)}
.seg button[aria-pressed="true"]{background:var(--mr);color:#fff}
.uyari{margin:0;color:#D93F45;font-size:.95rem}
.cevir-k{display:grid;gap:.3rem}
.cevir{
  font-size:2.2rem;color:#fff;border:0;border-radius:999px;min-height:4.4rem;background:linear-gradient(#FF7A59,#E8452C);
  box-shadow:0 6px 0 #B5321D,0 10px 18px rgba(181,50,29,.3);display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.3rem 1.2rem;width:100%
}
.cevir:active{transform:translateY(4px);box-shadow:0 2px 0 #B5321D}
.cevir:disabled{filter:saturate(.4) brightness(1.05);cursor:default}
.cevir.vurgu{animation:nabiz 1.3s ease-in-out infinite}
.cevir svg{width:2.1rem;height:2.1rem}
.cevir.don svg{animation:dn .7s linear infinite}
.ipucu{font-size:.95rem;color:var(--muted);text-align:center;line-height:1.3;font-weight:400;margin:.2rem 0 0}

.kupa-kutu{display:flex;justify-content:center;align-items:center;min-width:0}
#kupa{width:100%;max-width:470px;height:auto;touch-action:none;cursor:grab;overflow:visible;display:block;-webkit-user-select:none;user-select:none}
#kupa.tut{cursor:grabbing}

.sonuc{display:flex;flex-direction:column;gap:.4rem;--mr:var(--gold);padding:.6rem}
.gorsel{min-height:9rem;display:flex;align-items:center;justify-content:center;border-radius:16px;background:radial-gradient(circle at 50% 45%,#fff 0%,#FFF6E0 65%,#FDEBC4 100%);overflow:hidden;position:relative;color:#26303B}
.gorsel svg{height:9rem;width:auto;max-width:100%}
.gorsel.belir>*{animation:belir .6s cubic-bezier(.2,.9,.3,1.35) both}
.gem{display:grid;justify-items:center;gap:.2rem;padding:.4rem}
.gem .em{font-size:5.2rem;line-height:1}
.gem .gw{font-size:1.7rem}
.gem .hl{background:#FFE9A8;border-radius:8px;padding:0 .12em}
.gem .hl.v{color:#E11D48} .gem .hl.c{color:#1E3A8A}
.okuma{display:flex;justify-content:center;align-items:center;font-size:5rem;line-height:1;min-height:6rem;cursor:pointer;flex-wrap:nowrap}
.okuma.u3{font-size:3.9rem}
.okuma .p{
  display:inline-block;box-shadow:inset 0 0 0 4px var(--pc);background:var(--pb);color:var(--pc);border-radius:16px;padding:.1em .18em 0;margin:0 .06em;
  transition:padding .5s,margin .5s,box-shadow .5s,background-color .5s;animation:pop .4s ease both;animation-delay:var(--d)
}
.okuma .p.v{--pc:var(--unlu);--pb:var(--pbv)} .okuma .p.c{--pc:var(--unsuz);--pb:var(--pbc)}
.okuma .ara{display:inline-block;max-width:1.2em;overflow:hidden;color:#94A3B8;font-size:.55em;transition:max-width .5s,opacity .4s;animation:pop .3s ease both;animation-delay:var(--d)}
.okuma.birlesik .p{box-shadow:0 0 0 0 transparent inset;background-color:transparent;padding:.1em 0 0;margin:0}
.okuma.birlesik .ara{max-width:0;opacity:0}
.okuma .bekle{font-size:1.25rem;color:var(--muted);text-align:center;font-weight:400}
.hecele{text-align:center;font-size:1.2rem;color:var(--muted);min-height:1.6rem}
.hecele b{font-size:1.5rem;color:var(--mur)}
.hecele b.v{color:var(--unlu)} .hecele b.c{color:var(--unsuz)}
.dugmeler{display:flex;gap:.5rem}
.okudum{flex:1;font-size:1.7rem;color:#fff;border:0;border-radius:999px;min-height:3.4rem;background:linear-gradient(#34D399,#16A34A);box-shadow:0 5px 0 #15803D}
.oku{flex:none;font-size:1.4rem;color:#fff;border:0;border-radius:999px;min-height:3.4rem;padding:0 1.1rem;background:linear-gradient(#60A5FA,#2563EB);box-shadow:0 5px 0 #1D4ED8}
.oku:active{transform:translateY(3px);box-shadow:0 2px 0 #1D4ED8}
.oku:disabled{opacity:.4;cursor:default;transform:none}
.okudum:active{transform:translateY(3px);box-shadow:0 2px 0 #15803D}
.okudum:disabled{opacity:.4;cursor:default;transform:none}
.okudum.tamam{opacity:1;background:#E7F8EE;color:#15803D;box-shadow:none;border:3px solid #86EFAC}

.mold{display:grid;gap:.6rem;--mr:var(--m3)}
.mhead{display:flex;align-items:center;gap:.8rem}
.pic{width:4.8rem;height:4.8rem;border-radius:50%;background:var(--soft);border:3px solid var(--line);display:grid;place-items:center;font-size:2.9rem;line-height:1;flex:none}
.mhead b{display:block;font-size:1.15rem}
.mhead span{color:var(--muted);font-size:.95rem;font-weight:400}
.mslots{display:flex;flex-wrap:wrap;gap:.5rem}
.ms{min-width:4.6rem;height:3.8rem;padding:0 .7rem;border:3px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.1rem;line-height:1}
.ms.fill{border-style:solid;border-color:var(--mr);background:var(--soft)}
.ms .v{color:var(--unlu)} .ms .c{color:var(--unsuz)}
.mslots.done .ms{border-color:#16A34A;background:#D4F0DC}
.mslots.done .ms .v{color:#B0123F} .mslots.done .ms .c{color:#1E3A8A}
.mmsg{margin:0;min-height:1.4em}
.mbtns{display:flex;flex-wrap:wrap;gap:.5rem}
.mbtns button{border:3px solid var(--line);background:var(--soft);color:var(--mur);border-radius:14px;padding:.45rem .8rem;box-shadow:0 4px 0 var(--line);font-size:1rem}
.mbtns .add{background:var(--mr);border-color:var(--mr);color:#fff}
.mbtns button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.fchips{display:flex;flex-wrap:wrap;gap:.4rem}
.fchip{background:var(--soft);border:3px solid var(--line);border-radius:999px;padding:.1rem .8rem;font-size:1.2rem}

.alan.m5:not(.kalip){display:block}
.alan.m5:not(.kalip) .kol.sol,.alan.m5:not(.kalip) .kupa-kutu,.alan.m5:not(.kalip) .sonuc{display:none}
.alan.m5:not(.kalip) .kol.sag{display:block}
.altsek{justify-self:start;max-width:100%}
.mkal{display:inline-flex;align-items:center;gap:.1rem;font-size:2rem;line-height:1;padding:.4rem .7rem .3rem;border-radius:16px;background:var(--soft);border:4px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:700}
.mkal.su{border-color:var(--mr);box-shadow:0 4px 0 var(--mr);background:var(--kart)}
.mkal:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mkal .v,.hecele .v,.okuma.kelime .v{color:var(--unlu)} .mkal .c,.hecele .c,.okuma.kelime .c{color:var(--unsuz)}
.bos{display:inline-block;width:1.15rem;height:1.15rem;border:3px dashed #8FA0B3;border-radius:50%;margin:0 .15rem}
.okuma.kelime{display:block;text-align:center;font-size:3.6rem;line-height:1.1;min-height:4rem}
.secim-k .mini{justify-self:start;margin-top:.2rem}
.mold{gap:.8rem}
.mold .seg.wtab{justify-self:start}
.wbox{background:var(--kart);border:3px solid var(--line);border-radius:20px;padding:.8rem;display:grid;gap:.6rem}
.mold .secimler .sec{font-size:2.4rem;min-width:3.8rem;min-height:3.8rem}
.hrow{align-items:center}
.ms.l{min-width:3.6rem;font-size:2.5rem}
.hres,.wres{font-weight:700;line-height:1.1;color:var(--unsuz)}
.hres{font-size:3rem;min-width:4rem}
.hres .v,.wres .v,.ych .v,.ysum .v{color:var(--unlu)} .hres .c,.wres .c,.ych .c,.ysum .c{color:var(--unsuz)}
.wres{font-size:3.6rem;text-align:center;min-height:4rem}
.wres.done{color:#16A34A}
.mhead .ms span{font-size:inherit;font-weight:700}
.mhead .mslots .ydash{font-size:1.6rem;color:var(--muted);font-weight:700}
.ms{font-weight:700}
.ydash{font-size:1.6rem;color:var(--muted);font-weight:700}
.ych{border:3px solid var(--mr);background:var(--soft);border-radius:16px;font-size:2.8rem;line-height:1.1;padding:.2rem .8rem;box-shadow:0 4px 0 var(--mr);font-weight:700}
.ych:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mr)}
.ychips{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.yrow{grid-template-columns:auto 1fr;align-items:center}
.yrow .ysum,.yrow .mbtns{grid-column:2}
.ysum{font-size:1.3rem;color:var(--muted)}
.ysum .v,.ysum .c{font-weight:700}
#wIn{font:700 2rem/1.2 var(--font);width:min(30rem,100%);background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:.4rem .8rem;color:var(--mur)}
#wIn:focus{outline:3px solid var(--mr);outline-offset:2px}


/* Sakin, açık tema: mat krem zemin, yüksek yazı karşıtlığı, az ve tutarlı renk (ünlü kırmızı, ünsüz mavi), dikkat dağıtan hareket yok. */
html{background:#FAF7EE}
body{background:#FAF7EE;color:#1F2933}
header{background:#fff;color:var(--koyu);border:3px solid var(--line);box-shadow:none}
header .ders{color:var(--muted);opacity:1}
header h1{color:var(--koyu)}
.rz{border:2px solid var(--line);box-shadow:none}
.ub{background:var(--soft);color:var(--koyu);border:3px solid var(--line)}
.ub.acik{background:var(--koyu);color:#fff;border-color:var(--koyu)}
.stars{background:var(--soft);color:var(--koyu);border:3px solid var(--line)}
.kart,.ayar,.wbox{box-shadow:none}
.cevir.vurgu{animation:none}
.cevir{background:linear-gradient(#E9776A,#D9604F);box-shadow:0 5px 0 #B5483A}
.okudum{background:linear-gradient(#5BB58D,#3F9C74);box-shadow:0 5px 0 #2F7D5B}
.oku{background:linear-gradient(#6FA0CF,#4F82B8);box-shadow:0 5px 0 #3C6A9C}
/* ---- 2. oyun: Pençe makinesi ---- */
.oyunsec{justify-self:start;max-width:100%}
.oyunsec button{font-size:1.1rem}
.pcalan{display:grid;grid-template-columns:minmax(13rem,.95fr) minmax(0,1.75fr) minmax(15rem,1.2fr);gap:.8rem;align-items:start;--mr:var(--m3)}
.pcalan .kart{--mr:var(--m3)}
.pcset,.pchedef,.pcsonuc,.pcraf{display:grid;gap:.6rem}
.pcset .seg{width:100%}
.pcset .seg button{flex:1 1 auto}
.dinle{font-size:1.5rem;color:#fff;border:0;border-radius:999px;min-height:3.4rem;padding:0 1.2rem;background:linear-gradient(#6FA0CF,#4F82B8);box-shadow:0 5px 0 #3C6A9C}
.dinle:active{transform:translateY(3px);box-shadow:0 2px 0 #3C6A9C}
.dinle:disabled{opacity:.5}
.pcmsg{margin:0;min-height:1.4em;font-size:1.1rem}
.pcscore{display:flex;flex-wrap:wrap;gap:.4rem}
.pcscore span{background:var(--soft);border:3px solid var(--line);border-radius:999px;padding:.1rem .8rem;font-size:1.1rem}
.pcscore span.on{border-color:var(--m3);background:#fff}
.machine{container-type:inline-size;width:min(100%,520px);margin:0 auto}
.mc{background:linear-gradient(100deg,#6F61C4 0,#9A8CE0 12%,#8476D0 50%,#9A8CE0 88%,#6F61C4 100%);border-radius:22px;padding:2.2cqw 3cqw 3cqw;box-shadow:0 .7cqw 0 #5D519A,0 1.4cqw 0 #4B3F87,0 2.2cqw 3cqw rgba(40,20,90,.40),inset 0 .6cqw 0 rgba(255,255,255,.35)}
.mtop{display:flex;justify-content:center;align-items:center;gap:2cqw;color:#fff;font-size:5cqw;letter-spacing:.4cqw;padding:.6cqw 0 1.8cqw}
.mtop{text-shadow:0 .4cqw 0 rgba(60,30,120,.55)}
.mtop i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FFE08A 55%,#F2B33D);box-shadow:0 0 1.5cqw #FFE08A}
.mtop i:nth-child(even){background:#FF9DB4;box-shadow:0 0 1.5cqw #FF9DB4}
.glass{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#CFC6F0;border:1.2cqw solid #4B3F87;box-shadow:inset 0 1.2cqw 2.5cqw rgba(30,15,80,.45),inset 0 -.6cqw 1.5cqw rgba(255,255,255,.25)}
.bw{position:absolute;left:8%;right:8%;top:6%;bottom:20%;background:radial-gradient(circle at 50% 35%,#FFFFFF 0,#E6F3FF 45%,#CDE3FA 100%)}
.bw::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(120,100,200,.10) 0 .5cqw,transparent .5cqw 9cqw)}
.sw{position:absolute;top:0;width:8%;height:100%}
.sw.l{left:0;clip-path:polygon(0 0,100% 6%,100% 80%,0 100%);background:linear-gradient(90deg,#8D7FD4,#B5A9EA)}
.sw.r{right:0;clip-path:polygon(0 6%,100% 0,100% 100%,0 80%);background:linear-gradient(270deg,#7A6CC4,#A397E2)}
.ceil{position:absolute;left:0;right:0;top:0;height:6%;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);background:linear-gradient(#FFF6C9,#E9DFFB)}
.refl{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,0) 8%,rgba(255,255,255,.34) 10% 17%,rgba(255,255,255,0) 19%,rgba(255,255,255,0) 26%,rgba(255,255,255,.20) 27% 30%,rgba(255,255,255,0) 32%)}
.cshadow{position:absolute;left:60%;bottom:3%;width:14cqw;height:3.2cqw;margin-left:-7cqw;border-radius:50%;background:radial-gradient(ellipse,rgba(40,20,90,.40) 0,rgba(40,20,90,0) 70%);z-index:2;pointer-events:none;transition:left .5s ease-in-out}
.rail{position:absolute;left:0;right:0;top:3%;height:3%;background:linear-gradient(#E4EAF1,#9AA7B5 55%,#6C7886);border-radius:99px;box-shadow:0 .9cqw 1cqw rgba(30,15,80,.30)}
.floor{position:absolute;left:0;right:0;bottom:0;height:20%;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 .5cqw,transparent .5cqw 10cqw),linear-gradient(#B9A9EE,#8F7FD6 55%,#6F5FBF)}
.chute{position:absolute;left:0;bottom:0;width:25%;height:24%;border-top-right-radius:12px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;color:#B8264F;font-weight:700;font-size:3cqw;letter-spacing:.3cqw;padding-top:3cqw;z-index:1;
  text-shadow:0 .3cqw 0 rgba(255,255,255,.9);border-right:.9cqw solid #FF5C7A;
  background:radial-gradient(ellipse 80% 70% at 50% 85%,#FFFBD0 0,#FFD76A 45%,#FFA6B8 100%);
  box-shadow:inset 0 1.4cqw 1.6cqw rgba(160,50,90,.30),inset -.5cqw 0 0 rgba(255,255,255,.35),0 0 2.4cqw rgba(255,215,106,.75)}
.chute::before{content:"";position:absolute;left:0;right:0;top:0;height:2.4cqw;background:repeating-linear-gradient(90deg,#FF5C7A 0 2.2cqw,#fff 2.2cqw 4.4cqw);box-shadow:0 .5cqw .6cqw rgba(120,30,70,.35)}

function pcSleep(ms){return new Promise(function(r){setTimeout(r,REDUCE?Math.min(ms,120):ms)})}
/* Hece çalışması: seçili harflerden 2 harfli (ünsüz+ünlü, ünlü+ünsüz) ve 3 harfli (ünsüz+ünlü+ünsüz) heceler.
   k: 2 = yalnız 2 harfli, 3 = yalnız 3 harfli, 23 = karışık. */
function sylPool(k){
  var vs=V(),on=onsets(),co=codas(),out=[],seen={};
  function add(t){if(!seen[t]){seen[t]=1;out.push({s:[t],e:''})}}
  if(k!==3){
    on.forEach(function(c){vs.forEach(function(v){add(c+v)})});
    vs.forEach(function(v){co.forEach(function(c){add(v+c)})});
  }
  if(k!==2){
    on.forEach(function(c){vs.forEach(function(v){co.forEach(function(d){add(c+v+d)})})});
  }
  return out;
}
function icMsg(ic){
  return ic?'Bu harflerle yeterli hece çıkmadı. Ayarlar\'dan ünlü ve ünsüz harfler ekle.':'Bu harflerle yeterli sözcük çıkmadı. Ayarlar\'dan harf ekle ya da \"Kendi sözcüklerim\"e sözcük yaz.';
}
function pcPool(ic){
  if(ic)return sylPool(ic);
  var L=allL();
  return WORDS.filter(function(w){
    var t=w.s.join('');
    return t.length>=2&&t.length<=9&&Array.from(t).every(function(c){return L.indexOf(c)>-1});
  });
}
function pcSim(a,b){
  var x=a.s.join(''),y=b.s.join(''),i=0,j=0;
  while(i<x.length&&i<y.length&&x[i]===y[i])i++;
  while(j<x.length&&j<y.length&&x[x.length-1-j]===y[y.length-1-j])j++;
  var shared=0;Array.from(x).forEach(function(c){if(y.indexOf(c)>-1)shared++});
  return i*3+j*2+(x.length===y.length?2:0)+shared/Math.max(x.length,y.length)*2+Math.random();
}

  P.tok++;P.busy=false;P.hold=null;P.tries=0;P.lives=3;P.flash=-1;P.lost=false;P.solved=false;P.msg='';P.err='';
  var n=S.pc.lv===1?3:6,pool=pcPool(S.pc.ic);
  if(pool.length<n){

    P.err=icMsg(S.pc.ic);

  var withE=pool.filter(function(w){return w.e}),tp=(withE.length?withE:pool);
  var t=tp[rnd(tp.length)],cand=pool.filter(function(w){return w.s.join('')!==t.s.join('')}),others;
  if(S.pc.lv===3){cand.sort(function(a,b){return pcSim(t,b)-pcSim(t,a)});others=cand.slice(0,n-1)}
  else others=shuf(cand).slice(0,n-1);
  var ws=shuf([t].concat(others));
  P.target=t;P.words=ws;P.round++;

  /* Tehlikeli yerlerde de doğru sözcük olsun: oradan çekersen kule yıkılır. */

/* Yanlış taş: kule yıkılır. */
async function klCollapse(ti,el,why){
  var tok=Kl.tok,T=Kl.towers[ti],f=S.kl.form;
  Kl.busy=true;
  var tw=document.getElementById('tw'+ti);
  if(tw){
    tw.querySelectorAll('.b3').forEach(function(b){
      var li=Number(b.dataset.l),bx=b.firstChild;
      bx.classList.remove('drag');
      bx.style.setProperty('--cx',(rnd(90)-45)+'cqw');
      bx.style.setProperty('--cy',(li*KH+KH/2-4+rnd(3))+'cqw');
      bx.style.setProperty('--cz',(rnd(60)-20)+'cqw');
      bx.style.setProperty('--rx',(rnd(120)-60)+'deg');
      bx.style.setProperty('--rz',(rnd(140)-70)+'deg');
    });
    void tw.offsetWidth;
    tw.classList.add('collapsing');
  }
  noSnd();say('Kule yıkıldı!');klBoom();klMascot('oops','Hay aksi!');
  await pcSleep(1700);if(tok!==Kl.tok)return;
  var fr=klFresh();T.layers=fr.layers;T.v=0;T.tries++;klAssign(T);
  if(f===2){
    Kl.sc[1-ti]++;
    Kl.toy=Kl.target.e||PC_TOY[rnd(PC_TOY.length)];
    Kl.solved=true;
    Kl.msg='Kule yıkıldı! Puan '+klName(1-ti)+'\'na gitti.';
    klRenderTower(ti);klRenderHedef();klRenderSonuc();
    await klSpeakCards(tok);
  }else{
    Kl.towers[ti]=klFresh();
    klNewRound(true);
    Kl.msg=(why==='tehlike'?'Doğru kelimeydi ama bu tahtayı çekmek kuleyi devirdi! ':'Hay aksi! Kule yıkıldı. ')+'Yeni kule, yeni kelime!';
    klRenderHedef();
    klMascot('tip','Yeni kule kuruldu!');
  }
}
async function klSpeakCards(tok){
  var ps=Kl.target.s,cards=document.querySelectorAll('#klKart .hk'),i;
  if(S.kl.form!==2){say(['Harika!','Aferin!','Süper!','Bravo!'][rnd(4)]);await pcSleep(900);if(tok!==Kl.tok)return}
  for(i=0;i<ps.length;i++){
    if(tok!==Kl.tok)return;
    say(ps[i],i>0||S.kl.form!==2);
    cards.forEach(function(c,k){c.classList.toggle('on',k===i)});
    await pcSleep(850);
  }
  cards.forEach(function(c){c.classList.remove('on')});
  if(tok!==Kl.tok)return;
  var kw=$('#klKw');if(kw)kw.style.visibility='visible';
  say(ps.join(''),true);
  await pcSleep(1100);if(tok!==Kl.tok)return;
  var b=$('#klSonraki');if(b){b.disabled=false;b.textContent=klLast()?'Sonuç ▶':'Sonraki ▶'}
  Kl.busy=false;
  /* Hamleden sonra "Sonraki" tuşuna basmadan kendiliğinden yeni sözcüğe geç. */
  await pcSleep(900);
  if(tok===Kl.tok&&Kl.solved&&!Kl.over&&S.game==='kule')klNext();
}
function klNext(){
  if(klLast()){Kl.over=true;Kl.busy=false;klRenderHedef();klRenderSonuc();confetti(90);return}
  klNewRound();
}
(function(){
  var drag=null;
  function back(d){d.bx.classList.remove('drag');d.bx.style.setProperty('--pl','0')}
  function decide(){
    var d=drag;drag=null;
    if(Kl.busy||Kl.solved||Kl.over){back(d);return}
    if(d.w!==Kl.target.s.join(''))klCollapse(d.ti,d.el,'yanlis');
    else if(!d.sf)klCollapse(d.ti,d.el,'tehlike');
    else klPull(d.ti,d.li,d.bi,d.el,d.sign);
  }
  var box=$('#klTowers');
  box.addEventListener('pointerdown',function(e){
    Kl.act=Date.now();
    var f=e.target.closest('.fe[data-pull]');
    if(!f||Kl.busy||Kl.solved||Kl.over||drag)return;
    var T=Kl.towers[Number(f.dataset.t)];if(!T||T.rot)return;
    var kt=f.closest('.kt');
    drag={el:f,bx:f.parentNode,ti:Number(f.dataset.t),li:Number(f.dataset.l),bi:Number(f.dataset.b),w:f.dataset.w,sign:Number(f.dataset.s),sf:f.dataset.sf==='1',x:e.clientX,y:e.clientY,id:e.pointerId,W:kt.getBoundingClientRect().width||400};
    try{f.setPointerCapture(e.pointerId)}catch(err){}
    drag.bx.classList.add('drag');e.preventDefault();
  });
  box.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dd=Math.hypot(e.clientX-drag.x,e.clientY-drag.y),p=Math.min(dd*.9*100/drag.W,KL*.8);
    drag.bx.style.setProperty('--pl',String(drag.sign*p));
    if(p>=KL*.35)decide();
  });
  function end(e){
    if(!drag||(e&&e.pointerId!==drag.id))return;
    var d=drag;drag=null;back(d);
  }
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('click',function(e){
    Kl.act=Date.now();
    if(e.target.closest('#kmas')){if(Kl.target&&!Kl.over){say(Kl.target.s.join(''));klMascot('hop','Dinle bakalım!')}return}
    if(e.target.closest('#klEar')){if(Kl.target&&!Kl.over)say(Kl.target.s.join(''));return}
    var w=e.target.closest('button[data-wh]');
    if(!w||Kl.busy||Kl.over)return;
    klRotate(Number(w.dataset.t),Number(w.dataset.wh));
  });
  $('#klSet').addEventListener('click',function(e){
    var b=e.target.closest('.seg button');if(!b||Kl.busy)return;
    S.kl[b.parentNode.dataset.kk]=Number(b.dataset.v);save();
    Kl.key='';renderKule();
  });
  $('#klHedef').addEventListener('click',function(e){
    if(e.target.closest('#klDinle')&&Kl.target&&!Kl.over)say(Kl.target.s.join(''));
  });
  $('#klSonuc').addEventListener('click',function(e){
    var n=e.target.closest('#klSonraki');
    if(n&&!n.disabled)klNext();
    else if(e.target.closest('#klYeni'))klRestart();
    else if(e.target.closest('.hk'))say(Kl.target.s[Number(e.target.closest('.hk').dataset.i)]);
    else if(e.target.closest('#klKw'))say(Kl.target.s.join(''));
  });
})();

/* ---- Neon Masa Hokeyi: diskteki ilk heceyi doğru ikinci hecenin kalesine vur ---- */
var Hk={key:'',target:null,goals:[],ci:0,tabs:[],round:0,sc:[0,0],over:false,solved:false,tok:0,msg:'',err:'',raf:0,last:0,time:0,hi:-1,lock:false,nt:0};
var HW=340,HH=480,HG=76,HR=25,HM=30,HCOL=['#FF4FA3','#2EE6D6','#FFD23F'];
var HKALL=null,HLIM=.57;
function hkWordSet(){
  if(HKALL)return HKALL;
  HKALL={};WORDS.forEach(function(w){HKALL[w.s.join('')]=1});return HKALL;
}
function hkWords(){return pcPool(0).filter(function(w){return w.s.length===2})}
function hkMakeGoals(t){
  var n=S.hk.lv===1?2:3,set=hkWordSet(),pool=hkWords(),seen={},c0=t.s[1],cand=[],wsyl=[];
  seen[c0]=1;
  pool.forEach(function(w){var y=w.s[1];if(!seen[y]&&!set[t.s[0]+y]){seen[y]=1;wsyl.push(y)}});
  sylPool(23).forEach(function(o){var y=o.s[0];if(!seen[y]&&!set[t.s[0]+y]){seen[y]=1;cand.push(y)}});
  var others;
  if(S.hk.lv===3){
    var all=wsyl.concat(cand);
    all.sort(function(a,b){return pcSim({s:[c0]},{s:[b]})-pcSim({s:[c0]},{s:[a]})});
    others=all.slice(0,n-1);
  }else others=shuf(wsyl).concat(shuf(cand)).slice(0,n-1);
  if(others.length<n-1)return null;
  var g=shuf([c0].concat(others));
  return {g:g,ci:g.indexOf(c0)};
}
function hkNewTable(){return {cv:null,cx:null,state:'play',tries:0,hint:false,fl:-1,flt:0,puck:{x:HW/2,y:HH*.62,vx:0,vy:0},mal:{x:HW/2,y:HH-52,tx:HW/2,ty:HH-52,vx:0,vy:0},drag:null,ph:[0,1.7,3.4],won:false}}
function hkResetPuck(T){T.puck.x=HW/2;T.puck.y=HH*.62;T.puck.vx=0;T.puck.vy=0;T.state='play'}
function hkSlotW(){return HW/Hk.goals.length}
function hkCalcH(){
  var box=$('#hkTables');if(!box)return;
  var r=box.getBoundingClientRect(),nt=S.hk.form===2?2:1,w=(r.width-10*(nt-1))/nt;
  if(r.height>80&&w>80)HH=Math.max(440,Math.min(640,Math.round(HW*r.height/w)));
}
function hkNewRound(){
  hkCalcH();Hk.tok++;Hk.solved=false;Hk.msg='';Hk.err='';Hk.lock=false;Hk.hi=-1;
  var pool=hkWords();
  if(pool.length<3){Hk.target=null;Hk.goals=[];Hk.err=icMsg(0)+' (Bu oyun iki heceli sözcük ister.)';hkRenderAll();return}
  var tp=pool,t,tr=0,g=null;
  Hk.recent=Hk.recent||[];
  var avoid=Math.min(Hk.recent.length,Math.max(0,tp.length-2),4);
  do{t=tp[rnd(tp.length)];tr++}while(tp.length>1&&Hk.recent.slice(-avoid).indexOf(t.s.join(''))>-1&&tr<40);
  tr=0;
  while(!(g=hkMakeGoals(t))&&tr++<20){t=tp[rnd(tp.length)]}
  if(!g){Hk.target=null;Hk.goals=[];Hk.err=icMsg(0);hkRenderAll();return}
  Hk.target=t;Hk.goals=g.g;Hk.ci=g.ci;Hk.round++;Hk.recent.push(t.s.join(''));if(Hk.recent.length>8)Hk.recent.shift();
  var nt=S.hk.form===2?2:1;
  while(Hk.tabs.length<nt)Hk.tabs.push(hkNewTable());
  Hk.tabs.length=nt;
  Hk.tabs.forEach(function(T){var m=hkNewTable();T.state='play';T.tries=0;T.hint=false;T.fl=-1;T.won=false;hkResetPuck(T);T.mal.x=T.mal.tx=m.mal.x;T.mal.y=T.mal.ty=m.mal.y;T.mal.vx=T.mal.vy=0});
  hkRenderAll();hkStart();
  setTimeout(function(){if(Hk.target===t&&!Hk.solved&&S.game==='hokey')say(t.s.join(''))},500);
}
function hkRestart(){Hk.round=0;Hk.sc=[0,0];Hk.over=false;Hk.target=null;hkNewRound()}
function hkLast(){return S.hk.form===2&&Hk.round>=S.hk.tur}

  });

function hkRenderAll(){hkRenderSet();hkRenderHedef();hkRenderTables();hkRenderSonuc();hkSize()}
function renderHokey(){
  var k=S.hk;if(!(k.lv>=1&&k.lv<=3))k.lv=1;k.form=1;if(!(k.tur>0))k.tur=3;
  var key=allL().join('')+'|'+k.lv+'|'+k.form+'|'+k.tur+'|'+(S.myWords||'');
  if(Hk.key!==key||(!Hk.target&&!Hk.err)){Hk.key=key;Hk.nt=0;$('#hkTables').innerHTML='';hkRestart();return}
  hkRenderAll();hkStart();
}
/* fizik */
function hkGoalie(i,n){
  var sw=HW/n,bw=34,rng=sw/2-bw/2-5,ph=Hk.time*1.5+i*1.9;
  return {x:sw*(i+.5)+Math.sin(ph)*rng,y:HG+8,w:bw,h:10};
}
function hkCirc(p,cx,cy,r,e){
  var dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy),R=HR+r;
  if(d<R&&d>0){
    var nx=dx/d,ny=dy/d;p.x=cx+nx*R;p.y=cy+ny*R;
    var vn=p.vx*nx+p.vy*ny;
    if(vn<0){p.vx-=(1+e)*vn*nx;p.vy-=(1+e)*vn*ny}
  }
}
function hkStep(T,dt){
  var p=T.puck,m=T.mal,n=Hk.goals.length,i;
  if(T.flt>0){T.flt-=dt;if(T.flt<=0)T.fl=-1}
  if(!n||T.state==='won'||T.state==='miss'||Hk.over)return;
  var dx=m.tx-m.x,dy=m.ty-m.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.min(10,Math.ceil(dist/9))),sdt=dt/steps;
  for(i=0;i<steps;i++){
    var ox=m.x,oy=m.y;
    m.x+=dx/steps;m.y+=dy/steps;
    m.vx=(m.x-ox)/sdt;m.vy=(m.y-oy)/sdt;
    var ex=p.x-m.x,ey=p.y-m.y,d=Math.hypot(ex,ey),R=HR+HM;
    if(d<R){
      var nx,ny;if(d<.01){nx=0;ny=-1}else{nx=ex/d;ny=ey/d}
      p.x=m.x+nx*R;p.y=m.y+ny*R;
      var rv=(p.vx-m.vx)*nx+(p.vy-m.vy)*ny;
      if(rv<0){p.vx-=1.9*rv*nx;p.vy-=1.9*rv*ny}
      if(p.y>HH-HR-2&&ny>.6){p.x+=(p.x<HW/2?-1:1)*6;p.vx+=(p.x<HW/2?-1:1)*120}
    }
  }
  m.vx*=.5;m.vy*=.5;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  var f=Math.exp(-.4*dt);p.vx*=f;p.vy*=f;
  /* disk rakip yarıda (tokmağın erişemediği yerde) kalırsa yavaşça bizim yarıya süzülür */
  if(p.y<HH*HLIM-30&&p.y>HG+HR&&Math.hypot(p.vx,p.vy)<110){p.vy+=420*dt}
  var sp=Math.hypot(p.vx,p.vy);
  if(sp>1050){p.vx*=1050/sp;p.vy*=1050/sp}else if(sp<4){p.vx=0;p.vy=0}
  if(p.x<HR){p.x=HR;p.vx=Math.abs(p.vx)*.9}
  if(p.x>HW-HR){p.x=HW-HR;p.vx=-Math.abs(p.vx)*.9}
  if(p.y>HH-HR){p.y=HH-HR;p.vy=-Math.abs(p.vy)*.9}
  if(p.y<HR){p.y=HR;p.vy=Math.abs(p.vy)*.9}
  var sw=HW/n;
  for(i=1;i<n;i++){[HG-50,HG-25,HG].forEach(function(py){hkCirc(p,sw*i,py,7,.9)})}
  if(S.hk.lv===3&&p.y<HG+40){
    for(i=0;i<n;i++){
      var g=hkGoalie(i,n),qx=Math.max(g.x-g.w/2,Math.min(p.x,g.x+g.w/2)),qy=Math.max(g.y-g.h/2,Math.min(p.y,g.y+g.h/2)),
        ex2=p.x-qx,ey2=p.y-qy,dd=Math.hypot(ex2,ey2);
      if(dd<HR){
        var nx2=dd>.01?ex2/dd:0,ny2=dd>.01?ey2/dd:1;
        p.x=qx+nx2*HR;p.y=qy+ny2*HR;
        var vn=p.vx*nx2+p.vy*ny2;
        if(vn<0){p.vx-=1.8*vn*nx2;p.vy-=1.8*vn*ny2}
      }
    }
  }
  if(p.y<HG-24&&!Hk.solved&&!Hk.lock){
    var slot=Math.max(0,Math.min(n-1,Math.floor(p.x/sw)));
    hkGoal(T,Hk.tabs.indexOf(T),slot);
  }
}
async function hkGoal(T,ti,slot){
  var tok=Hk.tok;
  if(T.state!=='play')return;
  if(slot===Hk.ci){
    Hk.lock=true;Hk.solved=true;T.state='won';
    Hk.tabs.forEach(function(O){if(O!==T){O.state='won';O.won=false}});
    T.won=true;T.puck.vx=T.puck.vy=0;
    okSnd();confetti(40);
    var first=T.tries===0;
    if(S.hk.form===2){Hk.sc[ti]++;Hk.msg='Aferin '+(ti+1)+'. öğrenci! Doğru kaleye ilk sen attın, 1 puan! ⭐'}
    else{starCount++;renderStars();Hk.msg='GOL! Aferin, buldun! 🎉'}
    emojiRain(['🎈','🎉','✨'][rnd(3)],16);
    hkRenderHedef();
    await hkSpeak(tok);
  }else{
    T.state='miss';T.tries++;T.fl=slot;T.flt=1.1;
    noSnd();
    if(S.hk.form===1){Hk.msg='Olmadı, tekrar dene! Sözcüğü yeniden dinle.';hkRenderHedef()}
    setTimeout(function(){say(Hk.target.s.join(''))},350);
    setTimeout(function(){
      if(tok!==Hk.tok||Hk.solved)return;
      hkResetPuck(T);
      if(T.tries>=2){T.hint=true;if(S.hk.form===1){Hk.msg='İpucu: parlayan kaleye bak!';hkRenderHedef()}}
    },950);
  }
}
async function hkSpeak(tok){
  var ps=Hk.target.s,i;
  for(i=0;i<ps.length;i++){
    if(tok!==Hk.tok)return;
    Hk.hi=i;say(ps[i],i>0);
    await pcSleep(900);
  }
  if(tok!==Hk.tok)return;
  Hk.hi=2;say(ps.join(''),true);
  await pcSleep(1500);if(tok!==Hk.tok)return;
  await pcSleep(700);
  if(tok===Hk.tok&&Hk.solved&&!Hk.over&&S.game==='hokey')hkNext();
}
function hkNext(){
  if(hkLast()){Hk.over=true;Hk.solved=true;Hk.tok++;hkRenderHedef();hkRenderSonuc();confetti(90);return}
  hkNewRound();
}
/* çizim */
function hkRR(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function hkTxt(c,s,cx,cy,fs,maxW){
  var chars=Array.from(disp(s));
  c.font='700 '+fs+'px Quicksand,"Trebuchet MS",sans-serif';
  var w=c.measureText(chars.join('')).width;
  if(w>maxW){fs=fs*maxW/w;c.font='700 '+fs+'px Quicksand,"Trebuchet MS",sans-serif'}
  var ws=chars.map(function(ch){return c.measureText(ch).width}),tot=ws.reduce(function(a,b){return a+b},0),x=cx-tot/2;
  c.textAlign='left';c.textBaseline='alphabetic';
  chars.forEach(function(ch,i){c.fillStyle=isV(lc(ch))?'#E11D48':'#1E3A8A';c.fillText(ch,x,cy+fs*.34);x+=ws[i]});
}
function hkDisk(c,p){

  var pg=c.createRadialGradient(p.x-8,p.y-8,3,p.x,p.y,HR);pg.addColorStop(0,'#FFFFFF');pg.addColorStop(1,'#F1E9FF');

}
function hkDraw(T){
  var c=T.cx;if(!c)return;
  var n=Hk.goals.length,sw=n?HW/n:HW,p=T.puck,m=T.mal,i,t=Hk.time;
  c.clearRect(0,0,HW,HH);
  var bg=c.createLinearGradient(0,0,0,HH);bg.addColorStop(0,'#0A0F36');bg.addColorStop(1,'#16104A');
  c.fillStyle=bg;c.fillRect(0,0,HW,HH);
  /* masa çizgileri */
  c.save();c.strokeStyle='rgba(255,79,163,.85)';c.shadowColor='#FF4FA3';c.shadowBlur=10;c.lineWidth=2.5;
  c.beginPath();c.moveTo(8,HH*.5);c.lineTo(HW-8,HH*.5);c.stroke();
  c.beginPath();c.arc(HW/2,HH*.5,52,0,6.3);c.stroke();
  c.strokeStyle='rgba(46,230,214,.85)';c.shadowColor='#2EE6D6';
  hkRR(c,3,3,HW-6,HH-6,16);c.stroke();
  c.restore();
  c.save();c.setLineDash([8,8]);c.strokeStyle='rgba(46,230,214,.45)';c.lineWidth=2;c.beginPath();c.moveTo(8,HH*HLIM);c.lineTo(HW-8,HH*HLIM);c.stroke();c.restore();
  if(Hk.tabs.length===2){c.fillStyle='rgba(191,247,255,.8)';c.font='700 15px Quicksand,sans-serif';c.textAlign='left';c.fillText((Hk.tabs.indexOf(T)+1)+'. öğrenci',14,HH-14)}
  /* kaleler */
  for(i=0;i<n;i++){
    var x0=sw*i,col=HCOL[i%HCOL.length],isC=(i===Hk.ci),glow=(T.hint&&isC&&!Hk.solved);
    c.save();
    c.fillStyle='rgba(255,255,255,.06)';c.fillRect(x0+4,4,sw-8,HG+8);
    var fl=(T.fl===i&&T.flt>0),good=(Hk.solved&&isC);
    c.shadowColor=fl?'#FF2D55':(good||glow?'#3CFF8F':col);c.shadowBlur=(glow?18+8*Math.sin(t*7):12);
    c.fillStyle=fl?'#FFD6DD':(good?'#D6FFE6':'#FFFFFF');
    hkRR(c,x0+7,7,sw-14,HG-22,10);c.fill();
    c.lineWidth=3.5;c.strokeStyle=fl?'#FF2D55':(good||glow?'#3CFF8F':col);c.stroke();
    c.restore();
    hkTxt(c,Hk.goals[i],x0+sw/2,7+(HG-22)/2,30,sw-34);
  }
  /* kaleciler */
  if(S.hk.lv===3){
    for(i=0;i<n;i++){
      var g=hkGoalie(i,n);
      c.save();c.shadowColor='#FFD23F';c.shadowBlur=12;c.fillStyle='#FFD23F';hkRR(c,g.x-g.w/2,g.y-g.h/2,g.w,g.h,5);c.fill();c.restore();
    }
  }
  /* disk */
  if(T.state!=='won')hkDisk(c,p);
  /* tokmak */
  c.save();
  c.shadowColor='#FF4FA3';c.shadowBlur=22;
  var mg=c.createRadialGradient(m.x-9,m.y-9,3,m.x,m.y,HM);mg.addColorStop(0,'#FFB3DA');mg.addColorStop(.55,'#FF2D93');mg.addColorStop(1,'#B3126B');
  c.fillStyle=mg;c.beginPath();c.arc(m.x,m.y,HM,0,6.3);c.fill();
  c.lineWidth=3;c.strokeStyle='#FFE0F0';c.stroke();
  c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(m.x,m.y,HM*.45,0,6.3);c.fill();
  c.restore();
  /* gol sonrası sözcük */
  if(Hk.solved&&Hk.target&&!Hk.over&&T.state==='won'){
    var ps=Hk.target.s;
    c.save();c.shadowColor='#3CFF8F';c.shadowBlur=22;c.fillStyle='rgba(255,255,255,.97)';hkRR(c,16,HH*.5-62,HW-32,124,18);c.fill();
    c.restore();
    c.font='700 24px Quicksand,sans-serif';c.textAlign='center';c.fillStyle='#2F7D5B';c.fillText(T.won||S.hk.form===1?'GOL! ⚽':'Gol atıldı',HW/2,HH*.5-30);
    if(Hk.hi>=0&&Hk.hi<2){
      hkTxt(c,ps[0],HW*.30,HH*.5+18,Hk.hi===0?58:42,HW*.4);
      hkTxt(c,ps[1],HW*.70,HH*.5+18,Hk.hi===1?58:42,HW*.4);
      c.fillStyle='#3CFF8F';c.fillRect(Hk.hi===0?HW*.12:HW*.52,HH*.5+44,HW*.36,5);
    }else hkTxt(c,ps.join(''),HW/2,HH*.5+18,56,HW-60);
  }
}
function hkLoop(ts){
  Hk.raf=0;
  if(S.game!=='hokey')return;
  var dt=Hk.last?Math.min(.033,(ts-Hk.last)/1000):.016;Hk.last=ts;Hk.time+=dt;
  Hk.tabs.forEach(function(T){hkStep(T,dt);hkDraw(T)});

}
